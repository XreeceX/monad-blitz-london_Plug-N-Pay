# Render blueprint — one Web Service serves the SPA and the room-sync API.
# Dashboard → New → Blueprint → pick this repo → Apply.
# Auto-deploys on push to main.

services:
  - type: web
    name: plug-n-pay-booth
    runtime: node
    rootDir: booth
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Optional once you know the public URL — makes the host QR encode
      # the canonical address instead of whatever host opened the page.
      # - key: VITE_PUBLIC_URL
      #   value: https://plug-n-pay-booth.onrender.com
